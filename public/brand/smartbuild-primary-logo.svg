<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <clipPath id="s-top-clip">
      <rect x="140" y="0" width="80" height="97"/>
    </clipPath>
    <clipPath id="s-bottom-clip">
      <rect x="140" y="97" width="80" height="50"/>
    </clipPath>
  </defs>

  <!-- Building/Crane Icon -->
  <g transform="translate(200, 50)">
    <!-- Left building (medium, navy) -->
    <rect x="-30" y="-24" width="16" height="24" rx="1.5" fill="#0B2345"/>
    <rect x="-27" y="-20" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-27" y="-15" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-27" y="-10" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-21" y="-20" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-21" y="-15" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-21" y="-10" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>

    <!-- Center building (tallest, navy) -->
    <rect x="-11" y="-36" width="20" height="36" rx="1.5" fill="#0B2345"/>
    <rect x="-8" y="-32" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-8" y="-26" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-8" y="-20" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-8" y="-14" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-8" y="-8" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-2" y="-32" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-2" y="-26" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-2" y="-20" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-2" y="-14" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="-2" y="-8" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="4" y="-32" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="4" y="-26" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="4" y="-20" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="4" y="-14" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>
    <rect x="4" y="-8" width="3.5" height="2.5" rx="0.5" fill="#FFFFFF" opacity="0.25"/>

    <!-- Right building (short, gray) -->
    <rect x="11" y="-17" width="14" height="17" rx="1.5" fill="#6B7280"/>
    <rect x="14" y="-13" width="3" height="2" rx="0.5" fill="#FFFFFF" opacity="0.2"/>
    <rect x="14" y="-8" width="3" height="2" rx="0.5" fill="#FFFFFF" opacity="0.2"/>
    <rect x="19" y="-13" width="3" height="2" rx="0.5" fill="#FFFFFF" opacity="0.2"/>
    <rect x="19" y="-8" width="3" height="2" rx="0.5" fill="#FFFFFF" opacity="0.2"/>

    <!-- Crane mast -->
    <line x1="9" y1="-36" x2="9" y2="-48" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Crane counter-jib (left) -->
    <line x1="9" y1="-48" x2="0" y2="-48" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <!-- Crane jib (right arm) -->
    <line x1="9" y1="-48" x2="28" y2="-48" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <!-- Crane cable -->
    <line x1="24" y1="-48" x2="24" y2="-40" stroke="#F5A623" stroke-width="1" stroke-linecap="round"/>
    <!-- Crane hook -->
    <path d="M22.5,-40 Q24,-37.5 25.5,-40" fill="none" stroke="#F5A623" stroke-width="1" stroke-linecap="round"/>

    <!-- Horizon line -->
    <path d="M-40,2 Q0,5.5 40,2" fill="none" stroke="#0B2345" stroke-width="1.5" opacity="0.15"/>
  </g>

  <!-- Interlocking SB Monogram -->
  <!-- Bottom half of S (behind B) -->
  <text x="172" y="115" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#0B2345" letter-spacing="-3" clip-path="url(#s-bottom-clip)">S</text>
  <!-- Full B (gold) -->
  <text x="194" y="115" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#F5A623" letter-spacing="-3">B</text>
  <!-- Top half of S (in front of B) -->
  <text x="172" y="115" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#0B2345" letter-spacing="-3" clip-path="url(#s-top-clip)">S</text>

  <!-- SMARTBUILD text -->
  <text x="200" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#0B2345" letter-spacing="8">SMARTBUILD</text>

  <!-- Tagline -->
  <text x="200" y="172" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="500" font-size="9" fill="#6B7280" letter-spacing="2.5">BUILD • MANAGE • MAINTAIN • GROW</text>
</svg>
