<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Circle border -->
  <circle cx="40" cy="40" r="38" fill="#FFFFFF" stroke="#0B2345" stroke-width="3"/>

  <!-- Building/Crane Icon -->
  <g transform="translate(40, 30)">
    <!-- Left building (medium, navy) -->
    <rect x="-18" y="-16" width="11" height="16" rx="1" fill="#0B2345"/>
    <!-- Center building (tallest, navy) -->
    <rect x="-6" y="-24" width="14" height="24" rx="1" fill="#0B2345"/>
    <!-- Right building (short, gray) -->
    <rect x="9" y="-11" width="10" height="11" rx="1" fill="#6B7280"/>

    <!-- Crane mast -->
    <line x1="8" y1="-24" x2="8" y2="-32" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
    <!-- Crane counter-jib -->
    <line x1="8" y1="-32" x2="1" y2="-32" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Crane jib -->
    <line x1="8" y1="-32" x2="21" y2="-32" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Crane cable -->
    <line x1="18" y1="-32" x2="18" y2="-25" stroke="#F5A623" stroke-width="1" stroke-linecap="round"/>
    <!-- Crane hook -->
    <path d="M16.5,-25 Q18,-22.5 19.5,-25" fill="none" stroke="#F5A623" stroke-width="1" stroke-linecap="round"/>

    <!-- Horizon line -->
    <path d="M-26,1 Q0,4 26,1" fill="none" stroke="#0B2345" stroke-width="1.2" opacity="0.12"/>
  </g>

  <!-- SB Monogram -->
  <text x="21" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="21" fill="#0B2345" letter-spacing="-1">S</text>
  <text x="34" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="21" fill="#F5A623" letter-spacing="-1">B</text>
</svg>
