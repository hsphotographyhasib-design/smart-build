<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Squircle background -->
  <rect width="64" height="64" rx="12.8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Building/Crane Icon -->
  <g transform="translate(32, 25)">
    <!-- Left building (medium, navy) -->
    <rect x="-14" y="-13" width="8" height="13" rx="1" fill="#0B2345"/>
    <!-- Center building (tallest, navy) -->
    <rect x="-5" y="-18" width="11" height="18" rx="1" fill="#0B2345"/>
    <!-- Right building (short, gray) -->
    <rect x="7" y="-9" width="8" height="9" rx="1" fill="#6B7280"/>

    <!-- Crane mast -->
    <line x1="6" y1="-18" x2="6" y2="-24" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Crane counter-jib -->
    <line x1="6" y1="-24" x2="1" y2="-24" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crane jib -->
    <line x1="6" y1="-24" x2="16" y2="-24" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crane cable -->
    <line x1="14" y1="-24" x2="14" y2="-19" stroke="#F5A623" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Horizon line -->
    <path d="M-20,1 Q0,3.5 20,1" fill="none" stroke="#0B2345" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- SB Monogram -->
  <text x="17" y="50" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="17" fill="#0B2345" letter-spacing="-1">S</text>
  <text x="28" y="50" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="17" fill="#F5A623" letter-spacing="-1">B</text>
</svg>
